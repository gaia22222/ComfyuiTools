<!DOCTYPE html>
<html lang="zh-TW" class="dark">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code & Base32 全能工具</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: { main: '#09090b', panel: '#18181b', surface: '#27272a', hover: '#3f3f46' },
                        accent: { DEFAULT: '#3b82f6', hover: '#2563eb', dim: 'rgba(59, 130, 246, 0.1)' },
                        success: { DEFAULT: '#10b981', dim: 'rgba(16, 185, 129, 0.1)' }

                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <!-- jsQR Library for decoding -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

        body { background-color: #09090b; color: #e4e4e7; font-family: 'Inter', sans-serif; }
        
        /* 滾動條 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #52525b; }

        /* 卡片與容器 */
        .panel-card {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 8px;
            transition: all 0.2s;
        }

        /* 拖曳區塊 */
        #uploadZone {
            transition: all 0.2s ease;
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='8' ry='8' stroke='%233F3F46FF' stroke-width='2' stroke-dasharray='12%2c 12' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
        }
        #uploadZone:hover, #uploadZone.drag-over {
            background-color: rgba(59, 130, 246, 0.05);
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='8' ry='8' stroke='%233B82F6FF' stroke-width='3' stroke-dasharray='12%2c 12' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
        }

        /* 掃描線動畫 */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: #3b82f6;
            box-shadow: 0 0 4px #3b82f6;
            top: 0;
            left: 0;
            animation: scan 2s linear infinite;
            display: none;
        }
        .scanning .scan-line { display: block; }
        
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* 結果文字區 */
        .code-block {
            font-family: 'JetBrains Mono', monospace;
            background: #0f0f10;
            border: 1px solid #27272a;
            border-radius: 4px;
            padding: 12px;
            color: #a1a1aa;
            word-break: break-all;
            position: relative;
        }
        
        .badge {
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-base32 { background-color: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }

        /* Tabs */
        .tab-btn {
            border-bottom: 2px solid transparent;
            color: #71717a;
            transition: all 0.2s;
        }
        .tab-btn.active {
            border-bottom-color: #3b82f6;
            color: #e4e4e7;
        }
        
        textarea {
            field-sizing: content;
            min-height: 100px;
        }
    </style>
</head>

    <script>
        // DOM Elements
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');
        const previewContainer = document.getElementById('previewContainer');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const scanLine = document.getElementById('scanLine');
        const errorToast = document.getElementById('errorToast');
        const errorMsg = document.getElementById('errorMsg');
        
        const resultStateEmpty = document.getElementById('resultStateEmpty');
        const resultContent = document.getElementById('resultContent');
        const rawText = document.getElementById('rawText');
        const base32Section = document.getElementById('base32Section');
        const base32Text = document.getElementById('base32Text');
        const base32ImageContainer = document.getElementById('base32ImageContainer');
        const base32ImagePreview = document.getElementById('base32ImagePreview');
        const actionButtons = document.getElementById('actionButtons');
        const openLinkBtn = document.getElementById('openLinkBtn');
        const metaSize = document.getElementById('metaSize');
        const metaType = document.getElementById('metaType');
        
        const processCanvas = document.getElementById('processCanvas');
        const processCtx = processCanvas.getContext('2d');

        // --- Base32 Core Logic ---
        const BASE32_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

        function decodeBase32(input) {
            // 移除空白、連字號、填充符號
            const cleanInput = input.replace(/[\s=\-]/g, "").toUpperCase();
            
            // 檢查是否包含非法字元
            if (!/^[A-Z2-7]*$/.test(cleanInput) || cleanInput.length === 0) {
                return null; // 非 Base32 或空
            }

            let bits = 0;
            let value = 0;
            let output = new Uint8Array(cleanInput.length * 5 / 8 | 0);
            let index = 0;

            for (let i = 0; i < cleanInput.length; i++) {
                value = (value << 5) | BASE32_ALPHABET.indexOf(cleanInput[i]);
                bits += 5;

                if (bits >= 8) {
                    output[index++] = (value >>> (bits - 8)) & 0xFF;
                    bits -= 8;
                }
            }
            return output; // 回傳 Uint8Array
        }

        function encodeBase32(inputBytes) {
            let bits = 0;
            let value = 0;
            let output = "";

            for (let i = 0; i < inputBytes.length; i++) {
                value = (value << 8) | inputBytes[i];
                bits += 8;

                while (bits >= 5) {
                    output += BASE32_ALPHABET[(value >>> (bits - 5)) & 31];
                    bits -= 5;
                }
            }

            if (bits > 0) {
                output += BASE32_ALPHABET[(value << (5 - bits)) & 31];
            }
            
            // Padding (Optional usually, but good for standard)
            // while (output.length % 8 !== 0) output += "=";

            return output;
        }

        function uint8ArrayToString(u8Array) {
            const decoder = new TextDecoder('utf-8', { fatal: false });
            let isBinary = false;
            let nullCount = 0;
            for(let i=0; i<Math.min(u8Array.length, 100); i++) {
                if(u8Array[i] === 0) nullCount++;
            }
            if(nullCount > 0) isBinary = true; 
            
            return {
                text: isBinary ? null : decoder.decode(u8Array),
                bytes: u8Array,
                isBinary: isBinary
            };
        }

        function stringToUint8Array(str) {
            return new TextEncoder().encode(str);
        }

        // --- Tab Switching ---
        function switchTab(tab) {
            const tabs = ['qr', 'converter'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                const view = document.getElementById(`view-${t}`);
                if (t === tab) {
                    btn.classList.add('active');
                    view.classList.remove('hidden');
                } else {
                    btn.classList.remove('active');
                    view.classList.add('hidden');
                }
            });
        }

        // --- Converter Logic ---
        function doConvert(action) {
            const inputVal = document.getElementById('convInput').value.trim();
            const outputEl = document.getElementById('convOutput');
            const errorEl = document.getElementById('convError');
            
            outputEl.value = "";
            errorEl.innerText = "";
            errorEl.classList.add('hidden');

            if (!inputVal) return;

            try {
                if (action === 'encode') {
                    // Text -> Base32
                    const bytes = stringToUint8Array(inputVal);
                    const base32 = encodeBase32(bytes);
                    outputEl.value = base32;
                } else {
                    // Base32 -> Text
                    const bytes = decodeBase32(inputVal);
                    if (!bytes) {
                        throw new Error("無效的 Base32 字串 (包含非法字元)");
                    }
                    const result = uint8ArrayToString(bytes);
                    
                    if (result.isBinary) {
                        outputEl.value = "[Binary Data] Hex:\n" + Array.from(result.bytes).map(b => b.toString(16).padStart(2,'0')).join(' ');
                    } else {
                        outputEl.value = result.text;
                    }
                }
            } catch (e) {
                errorEl.innerText = "錯誤: " + e.message;
                errorEl.classList.remove('hidden');
            }
        }


        // --- QR Drag & Drop Logic ---
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadZone.addEventListener(eventName, () => uploadZone.classList.add('drag-over'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadZone.addEventListener(eventName, () => uploadZone.classList.remove('drag-over'), false);
        });

        uploadZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFileSelect(files);
        }

        function handleFileSelect(files) {
            if (files.length === 0) return;
            const file = files[0];
            
            if (!file.type.startsWith('image/')) {
                showError('請上傳圖片檔案');
                return;
            }

            hideError();
            resetResult();
            
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.classList.remove('hidden');
                uploadPrompt.classList.add('opacity-0');
                previewContainer.classList.add('scanning');
                
                metaType.innerText = file.type.split('/')[1].toUpperCase();
                
                previewImage.onload = () => {
                    metaSize.innerText = `${previewImage.naturalWidth} x ${previewImage.naturalHeight}`;
                    scanQRCode(previewImage);
                };
            };
            reader.readAsDataURL(file);
        }

        function scanQRCode(img) {
            processCanvas.width = img.naturalWidth;
            processCanvas.height = img.naturalHeight;
            processCtx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight);
            
            const imageData = processCtx.getImageData(0, 0, processCanvas.width, processCanvas.height);
            
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert",
            });

            setTimeout(() => {
                previewContainer.classList.remove('scanning');
                
                if (code) {
                    showResult(code);
                } else {
                    showError('未偵測到 QR Code');
                }
            }, 600);
        }

        function showResult(code) {
            resultStateEmpty.classList.add('hidden');
            resultContent.classList.remove('hidden');
            
            const text = code.data;
            rawText.innerText = text;
            
            // 重置隱藏區塊
            base32Section.classList.add('hidden');
            base32ImageContainer.classList.add('hidden');
            base32Section.classList.remove('animate-pulse');
            
            // --- 新增：Google Auth Migration 偵測 ---
            if (text.startsWith("otpauth-migration://")) {
                const accounts = handleMigrationLink(text);
                if (accounts && accounts.length > 0) {
                    // 顯示 Migration 結果區塊
                    base32Section.classList.remove('hidden');
                    
                    // 建立顯示 HTML
                    let html = `<div class="space-y-4">`;
                    html += `<div class="text-xs text-blue-400 font-bold border-b border-blue-900/50 pb-2">Google Authenticator 資料 (${accounts.length} 筆)</div>`;
                    
                    accounts.forEach((acc, idx) => {
                        html += `
                        <div class="bg-black/30 p-2 rounded border border-zinc-700">
                            <div class="text-[10px] text-zinc-500 mb-1">${acc.issuer || 'Unknown Issuer'}</div>
                            <div class="text-xs text-zinc-300 font-bold mb-1">${acc.name}</div>
                            <div class="flex items-center gap-2 mt-2">
                                <code class="flex-1 bg-zinc-900 p-1.5 rounded text-green-400 font-mono text-[10px] break-all select-all">${acc.secret}</code>
                                <button onclick="navigator.clipboard.writeText('${acc.secret}')" class="text-zinc-500 hover:text-white">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                </button>
                            </div>
                        </div>`;
                    });
                    html += `</div>`;
                    
                    base32Text.innerHTML = html; // 使用 innerHTML 渲染列表
                    return; // 如果是 Migration 連結，處理完就結束，不跑後面的普通 Base32 偵測
                }
            }
            // ----------------------------------------

            // (以下保持原本的 Base32 偵測邏輯)
            const base32Bytes = decodeBase32(text);
            
            if (base32Bytes && base32Bytes.length > 0) {
                // ... (原有的 Base32 顯示邏輯保持不變) ...
                const decodedResult = uint8ArrayToString(base32Bytes);
                
                base32Section.classList.remove('hidden');
                base32Section.classList.add('animate-pulse');
                setTimeout(() => base32Section.classList.remove('animate-pulse'), 500);

                if (!decodedResult.isBinary) {
                    base32Text.innerText = decodedResult.text;
                } else {
                    base32Text.innerText = "[Binary Data] Hex: " + Array.from(base32Bytes).slice(0, 20).map(b => b.toString(16).padStart(2,'0')).join(' ') + (base32Bytes.length > 20 ? '...' : '');
                }

                // Image Magic Number Check (保持不變)
                if (base32Bytes.length > 8) {
                    // ... (原本的圖片顯示邏輯)
                    const header = Array.from(base32Bytes.slice(0, 4)).map(b => b.toString(16).padStart(2,'0')).join('');
                    let mimeType = null;
                    if (header.startsWith('89504e47')) mimeType = 'image/png';
                    else if (header.startsWith('ffd8ff')) mimeType = 'image/jpeg';
                    else if (header.startsWith('474946')) mimeType = 'image/gif';

                    if (mimeType) {
                        const blob = new Blob([base32Bytes], { type: mimeType });
                        const imageUrl = URL.createObjectURL(blob);
                        base32ImagePreview.src = imageUrl;
                        base32ImageContainer.classList.remove('hidden');
                        if(base32Text.innerText.startsWith('[Binary')) {
                                base32Text.innerText += `\n(Detected ${mimeType})`;
                        }
                    }
                }
            }

            // URL Check (保持不變)
            const urlPattern = /^(http|https):\/\/[^ "]+$/i;
            if (urlPattern.test(text)) {
                actionButtons.classList.remove('hidden');
                openLinkBtn.href = text;
            } else {
                actionButtons.classList.add('hidden');
            }
        }

        function showError(msg) {
            errorMsg.innerText = msg;
            errorToast.classList.remove('hidden');
            setTimeout(() => errorToast.classList.add('hidden'), 4000);
        }

        function hideError() {
            errorToast.classList.add('hidden');
        }

        function resetResult() {
            resultStateEmpty.classList.remove('hidden');
            resultContent.classList.add('hidden');
            rawText.innerText = '';
            base32Text.innerText = '';
            base32Section.classList.add('hidden');
            actionButtons.classList.add('hidden');
            metaSize.innerText = '-';
            metaType.innerText = '-';
        }

        function resetApp() {
            fileInput.value = '';
            previewImage.src = '';
            previewContainer.classList.add('hidden');
            uploadPrompt.classList.remove('opacity-0');
            resetResult();
            hideError();
            
            // Clear converter inputs too
            document.getElementById('convInput').value = '';
            document.getElementById('convOutput').value = '';
            document.getElementById('convError').classList.add('hidden');
        }

        function copyToClipboard(elementId) {
            let text = "";
            const el = document.getElementById(elementId);
            if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') {
                text = el.value;
            } else {
                text = el.innerText;
            }
            
            if(!text) return;
            navigator.clipboard.writeText(text).then(() => {
                // Visual feedback logic (simplified for both types)
                const originalColor = window.getComputedStyle(el).color;
                // Just a quick flash effect
                el.style.opacity = '0.5';
                setTimeout(() => el.style.opacity = '1', 200);
            }).catch(err => {
                console.error('Copy failed', err);
            });
        }

        // --- Google Authenticator Migration Logic ---

        // 簡單的 Protobuf 解析器，專門針對 Google Auth 結構
        function parseMigrationPayload(buffer) {
            let offset = 0;
            const accounts = [];
            
            while (offset < buffer.length) {
                const tag = buffer[offset++];
                const fieldNumber = tag >> 3;
                const wireType = tag & 7;
                
                // 讀取 Varint (Length)
                let length = 0;
                let shift = 0;
                while (true) {
                    const byte = buffer[offset++];
                    length |= (byte & 0x7F) << shift;
                    if ((byte & 0x80) === 0) break;
                    shift += 7;
                }

                // Field 1 是 otp_parameters (repeated)
                if (fieldNumber === 1 && wireType === 2) {
                    const accountData = buffer.slice(offset, offset + length);
                    accounts.push(decodeOtpParameters(accountData));
                    offset += length;
                } else {
                    // 跳過不認識的欄位
                    offset += length;
                }
            }
            return accounts;
        }

        function decodeOtpParameters(buffer) {
            let offset = 0;
            let secret = new Uint8Array(0);
            let name = "";
            let issuer = "";
            
            while (offset < buffer.length) {
                const tag = buffer[offset++];
                const fieldNumber = tag >> 3;
                const wireType = tag & 7;
                
                let length = 0;
                let shift = 0;
                while (true) {
                    const byte = buffer[offset++];
                    length |= (byte & 0x7F) << shift;
                    if ((byte & 0x80) === 0) break;
                    shift += 7;
                }

                if (fieldNumber === 1) { // Secret (bytes)
                    secret = buffer.slice(offset, offset + length);
                } else if (fieldNumber === 2) { // Name (string)
                    name = new TextDecoder().decode(buffer.slice(offset, offset + length));
                } else if (fieldNumber === 3) { // Issuer (string)
                    issuer = new TextDecoder().decode(buffer.slice(offset, offset + length));
                }
                
                offset += length;
            }
            
            return {
                secret: encodeBase32(secret), // 重用你現有的 encodeBase32 轉回標準格式
                name: name,
                issuer: issuer
            };
        }

        function handleMigrationLink(uri) {
            try {
                const url = new URL(uri);
                const dataParam = url.searchParams.get("data");
                if (!dataParam) return null;

                // Base64 Decode (處理 URL-safe Base64)
                const base64 = dataParam.replace(/-/g, '+').replace(/_/g, '/');
                const binaryString = atob(base64);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                return parseMigrationPayload(bytes);
            } catch (e) {
                console.error("Migration parse error", e);
                return null;
            }
        }
    </script>
